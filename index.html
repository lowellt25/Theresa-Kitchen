<div class="Ideas">
    <button id="ideasButton" onclick="openIdeaForm()">+</button> 
    <div class="ideaFormPopup" id="ideaForm">
        <form class="form-container">
            <input type="text" placeholder="What's your great idea?" id="greatIdeaInput">
            <button type="button" onclick="closeIdeaForm()">x</button>
            <button type="submit" id = "addButton">Add</button>
        </form>
    <script>
        function openIdeaForm(){
            document.getElementById("ideaForm").style.display = "inline";
            document.getElementById("ideasButton").style.display = "none";
        }
        function closeIdeaForm(){
            document.getElementById("ideaForm").style.display = "none";
            document.getElementById("ideasButton").style.display = "inline";
            document.getElementById("greatIdeaInput").value = "";
        }
    </script>
    </div>
