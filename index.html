<!--This file is the homepage of the website, and it is also the
    breakfast/lunch page. index.html must be kept in the root directory-->
<!DOCTYPE html>
<html>
<head>
    <title>Theresa's Kitchen</title>
    <link rel="stylesheet" href="kitchen.css"
</head>


<body>

<div id = "header">
    <h1>Theresa's Kitchen</h1>
</div>

<!--Navigation Bar-->
<nav class = "navbar">
    <ul>
        <li><a href = "index.html">Lunch/Dinner</a></li>
        <li><a href = "breakfast.html">Breakfast</a></li>
        <li><a href = "dessert.html">Dessert</a></li>
        <li><a href = "snacks.html">Snacks</a></li>
    </ul>
</nav>

<!--Recipes Section-->
<div class="recipes">
    <button id="recipesButton">+</button>
    <h2>Recipes</h2>
</div>
<hr>

<!--Ideas Section-->
<div class="Ideas">
    <button id = "editButton" onclick="openEdit()">✎</button> 
    <button id="ideasButton" onclick="openIdeaForm()">+</button>
    <button type="button" id="saveButton" style="display:none" onclick="closeEdit()">Save</button>
    <div id = "ideaForm" style="display:none"">
        <div class="ideaFormPopup">
                <input type="text" placeholder="What's your great idea?" id="greatIdeaInput">
                <button type="button" onclick="closeIdeaForm()">x</button>
                <button type="button" id="addButton">Add</button>
        </div>
    </div>
    <script>
        //When + button clicked, the ideaForm (input box, Add button, x button) is shown
        //and + button is hidden
        function openIdeaForm(){
            document.getElementById("ideaForm").style.display = "inline";
            document.getElementById("ideasButton").style.display = "none";
            document.getElementById("editButton").style.display = "none";
        }
        //When x button clicked, input box is cleared, ideaForm is hidden, + button
        function closeIdeaForm(){
            document.getElementById("ideaForm").style.display = "none";
            document.getElementById("ideasButton").style.display = "inline";
            document.getElementById("editButton").style.display = "inline";
            document.getElementById("greatIdeaInput").value = "";
        }
        function openEdit(){
            document.getElementById("saveButton").style.display = "inline";
            document.getElementById("editButton").style.display = "none";
            document.getElementById("ideasButton").style.display = "none";
            document.querySelectorAll(".removeButton").forEach(element => element.classList.toggle("removeButtonVisible"));
            document.querySelectorAll("li").forEach(element => element.classList.toggle("editListVisible"));
        }
        function closeEdit(){
            document.getElementById("saveButton").style.display = "none";
            document.getElementById("editButton").style.display = "inline";
            document.getElementById("ideasButton").style.display = "inline";
            document.querySelectorAll(".removeButton").forEach(element => element.classList.toggle("removeButtonVisible"));
            document.querySelectorAll("li").forEach(element => element.classList.toggle("editListVisible"));
        }           
        
            

    </script>

    <h2>Ideas</h2>
    <ul id="ideasList"></ul>
</div>


<script type="module">
  import { setupIdeas } from './ideas.js';
  setupIdeas('dunch');   // 'breakfast', 'dessert', 'snacks' on the other pages
</script>
</body>
</html>
